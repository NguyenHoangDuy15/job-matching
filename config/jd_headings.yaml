# Câu trong mục Yêu cầu có dấu hiệu dưới đây được chuyển sang Ưu tiên (US-10/AC1).
# Nội dung trong ngoặc được bỏ qua ("Có thẩm mỹ tốt (ưu tiên mạnh về in ấn)" vẫn là bắt buộc),
# trừ khi cả cụm trong ngoặc chỉ là dấu hiệu ("(điểm cộng, không bắt buộc)", "(Plus)").
preferred_markers:
  starts: [uu tien, diem cong, nice to have, preferred, preferably, plus, khuyen khich, bonus]
  contains: [loi the, diem cong, duoc uu tien, uu tien ung vien, khong bat buoc, is a plus,
             a plus, advantage, nice to have, nice-to-have, good to have, is preferred, cang tot]
  parenthetical: [diem cong, khong bat buoc, plus, nice to have, optional, uu tien, preferred]

# Heading lạ (không có ở trên): dòng ngắn, không gạch đầu dòng, không kết thúc bằng dấu chấm.
# Section được đoán theo nội dung khối bên dưới: đếm từ gợi ý, cần ít nhất `min_hits` lần.
unknown_heading:
  max_words: 7
  min_hits: 2
  cues:
    description: [thuc hien, phat trien, tham gia, xay dung, phoi hop, thiet ke, trien khai,
                  bao cao, ho tro, nghien cuu, van hanh, develop, build, design, maintain,
                  implement, collaborate, work with]
    requirements: [kinh nghiem, tot nghiep, ky nang, thanh thao, hieu biet, kien thuc, co kha nang,
                   trinh do, dai hoc, cao dang, experience, degree, knowledge, proficient, skills]
    benefits: [thuong, bao hiem, luong, nghi phep, du lich, team building, teambuilding, phu cap,
               tro cap, thu nhap, kham suc khoe, an trua, bhxh, salary, bonus, insurance,
               annual leave, holiday, moi truong lam viec, co hoi thang tien]
