# Heading Việt–Anh của 4 section JD (S2-D03, US-10). So khớp sau khi bỏ dấu, chữ thường,
# bỏ ký tự đầu dòng/số thứ tự và dấu ":" cuối. Một dòng là heading khi bắt đầu bằng một cụm
# dưới đây và phần còn lại không quá `max_extra_words` từ ("Yêu cầu ứng viên", "Quyền lợi được hưởng").
# Cụm dài hơn được thử trước. max_heading_words phải ≥ số từ của cụm dài nhất + max_extra_words. "other" = phần không thuộc 4 section (không trộn vào mô tả).
max_heading_words: 14
max_extra_words: 4

