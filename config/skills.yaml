# Từ điển kỹ năng IT (S2-D03, US-10/AC2). Nguồn sự thật duy nhất:
#   sửa file này → `uv run python scripts/build_skill_seed.py` → db/seed/seed_skills.sql.
# Level 1 = nhóm (ứng với ref.skill_categories), không ghi vào ref.skills.
# Level 2 = kỹ năng; level 3 = framework/công cụ con của một kỹ năng level 2.
# Từ nhập nhằng: ambiguous + context (từ ngữ cảnh) + rule (xem skillkit.taxonomy.ContextRule).
# Alias so khớp sau khi NFC + chữ thường, GIỮ DẤU: không bỏ dấu để "gõ" không thành "go".
# Nguồn chọn: tần suất technical_skills VietJobs (data/interim/vietjobs_it.csv),
# n-gram JD (data/interim/skill_candidates.csv), danh mục Stack Overflow Developer Survey.

