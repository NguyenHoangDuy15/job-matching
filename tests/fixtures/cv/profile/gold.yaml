# Nhãn chuẩn hồ sơ JSON cho 10 CV mẫu (S3-D04). Soạn từ nội dung GIẢ của từng CV
# (scripts/make_cv_samples.py + tests/fixtures/cv/manual), tính tại as_of.
#
# - years_exp: chỉ khoảng trong Kinh nghiệm, gộp chồng nhau, tính trọn tháng, không tính thực tập.
# - strong: kỹ năng có trong Kinh nghiệm/Dự án; listed: chỉ có ở Kỹ năng/Tóm tắt/Chứng chỉ/...
# - dictionary_issues: kỹ năng mà TỪ ĐIỂN (skills.yaml) nhận sai hoặc thiếu alias, không phải lỗi
#   luật D04. Bỏ khỏi phép so sánh. 5 lỗi tìm ra ở D04 đã sửa ở S3-D06 (alias + bỏ kỹ năng trong
#   tên công ty và URL), nên hiện không còn mục nào.
# - evidence: vài kỹ năng kiểm thêm mục và ngữ cảnh (công ty / tên dự án) của câu trích.

as_of: 2026-11-18

