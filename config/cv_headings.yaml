# Heading lạ (không có ở trên): dòng ngắn, IN HOA hoặc style Heading của DOCX, theo sau ≥ 2 dòng
# nội dung. Đoán section theo từ gợi ý trong khối; cần ≥ min_hits và hơn hẳn section thứ hai.
unknown_heading:
  max_words: 6
  min_hits: 2
  cues:
    experience: [cong ty, company, nhan vien, developer, engineer, lap trinh vien, ky su,
                 thuc tap, intern, chuyen vien, truong nhom, team lead, phu trach]
    projects: [du an, project, github, demo, tech stack, khach hang, client]
    education: [dai hoc, cao dang, truong, university, college, bachelor, master, cu nhan,
                ky su tot nghiep, gpa, chuyen nganh, major, thpt, tot nghiep]
    certifications: [chung chi, certified, certificate, certification, aws certified, ccna]
    languages: [tieng anh, tieng nhat, tieng trung, tieng han, english, japanese, ielts, toeic,
                jlpt, topik]
    other: [so thich, doc sach, du lich, the thao, am nhac, hobby, reading, travel]
  # Khoảng thời gian "03/2023 – nay", "2019 - 2021": mỗi dòng có khoảng thời gian cộng điểm
  # experience (và education nếu khối có từ học vấn).
  date_range_points: 1
