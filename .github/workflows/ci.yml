# CI chặn PR lỗi (TASK-H004, US-01.06/AC1; EN-01: lint + test + build).
# Tên job (lint, test, gitleaks, web) là tên required status check trong ruleset main: đổi tên job phải sửa ruleset.
# Job `web` thêm ở S2-H01: sau lần chạy đầu, nhờ admin thêm "web" vào required checks.
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  # Push thêm vào cùng PR thì hủy run cũ đang chạy, chỉ giữ run mới nhất.
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: Kiểm uv.lock khớp pyproject.toml
        run: uv sync --locked
      - name: ruff check
        run: uv run ruff check .
      - name: ruff format --check
        run: uv run ruff format --check .

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: Cài thư viện
        run: uv sync --locked
      - name: pytest
        run: uv run pytest -q

  gitleaks:
    runs-on: ubuntu-latest
    # gitleaks-action gọi API "list commits on a PR" nên cần pull-requests: read.
    # Khai báo ở job sẽ thay hẳn permissions chung, nên phải ghi lại contents: read.
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v7
        with:
          # Lấy toàn bộ lịch sử để gitleaks quét mọi commit của PR, không chỉ commit cuối.
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Comment vào PR cần quyền ghi; tắt đi, chi tiết leak vẫn có trong log và Job summary.
          GITLEAKS_ENABLE_COMMENTS: false

  web:
    # Web Next.js (apps/web): lint, kiểm kiểu và build giống hệt lúc deploy lên Cloudflare.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Cài thư viện
        run: npm ci
      - name: eslint
        run: npm run lint
      - name: Kiểm kiểu TypeScript
        run: npm run typecheck
      # Build không cần khóa Supabase: web tự hiện thông báo "chưa cấu hình" khi thiếu biến.
      - name: Build OpenNext (Cloudflare)
        run: npx opennextjs-cloudflare build

  rls:
    # Kiểm thử phân quyền RLS + Auth (S2-T02, US-02): dựng Postgres 16 trống, giả lập Supabase
    # (auth, storage, role), chạy migration + seed rồi db/tests/rls_test.sql.
    # Sau lần chạy xanh đầu tiên, nhờ admin thêm "rls" vào required checks của ruleset main.
    runs-on: ubuntu-latest
    services:
      postgres:
        # Có sẵn pgvector; pg_trgm, unaccent, citext là contrib đi kèm image.
        # Không có pg_cron: migration 0001 tự bỏ qua phần đặt lịch khi thiếu schema cron.
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: postgres
    steps:
      - uses: actions/checkout@v7
      - name: Giả lập Supabase (auth, storage, role)
        run: psql -v ON_ERROR_STOP=1 -q -f db/tests/supabase_ci_bootstrap.sql
      - name: Chạy migration theo thứ tự tên file
        run: |
          for f in db/migrations/*.sql; do
            echo "::group::$f"
            psql -v ON_ERROR_STOP=1 -q -f "$f"
            echo "::endgroup::"
          done
      - name: Seed dữ liệu tham chiếu
        run: |
          for f in db/seed/*.sql; do
            echo "::group::$f"
            psql -v ON_ERROR_STOP=1 -q -f "$f"
            echo "::endgroup::"
          done
      - name: rls_test.sql
        # File tự dừng với lỗi khi có test FAIL. Đếm thêm số PASS để phát hiện test bị xóa nhầm
        # (DoD S2-T02: tối thiểu 26 test).
        run: |
          set -o pipefail
          psql -v ON_ERROR_STOP=1 -f db/tests/rls_test.sql | tee rls.log
          passed=$(grep -c '| PASS$' rls.log || true)
          echo "PASS: $passed"
          test "$passed" -ge 26
