# Tên mục (heading) CV Việt–Anh → section chuẩn (S3-D02, US-12). Dùng chung cho D04 (mức bằng
# chứng), D05 (app.cvs.parsed_sections) và S6 (app.cv_chunks.section).
#
# So khớp sau khi: bỏ ký tự đầu dòng / số thứ tự ("1.", "II.", "01") / icon, bỏ dấu, chữ thường,
# "&" và "and" → "va". Cụm dài thử trước. Một dòng là heading khi mở đầu bằng một cụm dưới đây và:
#   - có ":" → heading kèm nội dung ("Kỹ năng: Python, SQL"), phần trước ":" không thêm từ nào;
#   - không có ":" → thêm tối đa `max_extra_words` từ (hoặc "va ..." như "Học vấn & Chứng chỉ"),
#     không kết thúc bằng dấu chấm/phẩy.
# Thêm cách viết mới: thêm một dòng ở đây, tăng `version` để worker biết đọc lại CV cũ.

version: cv-sections-1
max_extra_words: 2
max_heading_words: 8

