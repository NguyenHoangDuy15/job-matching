dataset:
  name: Vietnam IT Jobs Raw Data from TopCV 2026
  author: baocgb
  url: https://www.kaggle.com/datasets/baocgb/vietnam-it-jobs-raw-data-from-topcv-2026
  license: CC BY 4.0

raw_job_fields:
  - title
  - company
  - description
  - location
  - salary
  - posted_at
  - deadline
  - source_url

# Tên cột CSV -> trường raw_job. Giá trị null: raw_job chưa có trường tương ứng.
columns:
  title: title
  company: company
  location: location
  experience: null
  salary: salary
  date_posted: posted_at
  url: source_url

# Xét theo thứ tự từ trên xuống, tiêu đề khớp nhóm đầu tiên thì dừng.
